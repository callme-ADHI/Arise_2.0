<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Dark Zinc/Black Theme to match app theme -->
  <rect width="1024" height="1024" rx="200" fill="#09090b"/>
  
  <!-- Red Glow for Red Variant -->
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(512)">
      <stop stop-color="#dc2626" stop-opacity="0.2"/> <!-- red-600 -->
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Logo Group Scaled and Centered -->
  <g transform="translate(192, 192) scale(26.66)">
    <!-- The 'A' Shape -->
    <path
        d="M12 2L3 19H21L12 2Z"
        fill="#18181b" 
        stroke="#dc2626" 
        stroke-width="1.5"
        stroke-linejoin="round"
    />
    <!-- Internal Lines -->
    <path
        d="M12 2L12 16M7 14L17 14"
        stroke="#ef4444" 
        stroke-width="1.5"
        stroke-linecap="round"
    />
    <!-- The Dot -->
    <circle cx="12" cy="8" r="1.5" fill="#f87171" /> 
  </g>
</svg>
